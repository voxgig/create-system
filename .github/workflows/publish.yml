# Releases @voxgig/create-system: publishes to npm AND writes the git tag.
#
# Adapted from voxgig/create-sdkgen's publish.yml — the sibling scaffolder,
# same shape, same manifest at the repository root — which carries
# voxgig/sdkgen's reasoning for every guard below.
#
# ONE FILE, BECAUSE NPM ALLOWS EXACTLY ONE. A trusted publisher is registered
# on npmjs.com against a single workflow FILENAME, and every @voxgig package
# is registered against `publish.yml` or `release.yml`. The name itself is
# arbitrary, but only the ONE registered file can publish, so anything that
# must accompany a publish has to live inside it. Here that is the tag.
#
# A second workflow cannot publish whatever permissions it holds; npm rejects
# the exchange and reports it as
#
#   npm error 404 Not Found - PUT https://registry.npmjs.org/...
#
# — a 404, not a 403, so as not to leak whether the package exists.
#
# THE PACKAGE HAS NEVER PUBLISHED OVER OIDC, so the registration is the first
# thing to get wrong. 0.10.1 went out from a laptop through
# `npm run repo-stage-publish`, over a vaulted token: it sits on npm with no
# provenance attestation. Before the first release through this file:
#
#   npm trust github @voxgig/create-system --repo voxgig/create-system \
#     --file publish.yml --allow-publish --allow-stage-publish
#
# npm registers a publisher only against a package that already EXISTS, which
# @voxgig/create-system does, so there is nothing to bootstrap.
# `--allow-stage-publish` keeps the existing staged path usable; this file
# publishes directly, as the other @voxgig packages do. Until that command
# has run, a dispatch here fails the exchange as exactly the 404 above: the
# tests pass, the tarball packs, the PUT is rejected. The registration is
# what to check, and the package's npm settings page is where to check it. A
# `dry_run` here cannot: see DRY RUN below.
#
# TWO JOBS, BECAUSE THEY NEED DIFFERENT PRIVILEGES.
#
#   publish  id-token: write, contents: READ. Runs `npm ci`, the build and
#            the tests — i.e. dependency lifecycle scripts and project code.
#   tag      contents: write. Runs git and nothing else.
#
# Keeping them in one job would hand a repository-write credential to every
# dependency postinstall script that runs during `npm ci`, because checkout
# persists its token into the git config for the whole job.
#
# A ref pushed with GITHUB_TOKEN does NOT start another workflow run (GitHub
# suppresses that so workflows cannot trigger themselves), so the tag job
# cannot be replaced by "tag and let the publisher fire on it".
#
# `npm ci`, NOT `npm install`. Unlike the multi-language libraries, this
# repository COMMITS package-lock.json, so the release installs exactly what
# was reviewed. .github/workflows/ci.yml installs the same way.
#
# THIS IS NO LONGER THE ONLY AUTOMATED BUILD AND TEST. ci.yml was dormant in
# ci/ until it was activated, and nothing compiled this package on a push
# before that; now it builds and tests on every push and pull request.
#
# THE BUILD AND TEST BELOW STAY ANYWAY, and not out of caution. Nothing here
# reads ci.yml's result: a dispatch releases the ref it is given whether that
# commit's CI is green, red, or still queued. So these steps are not a
# duplicate of CI, they are the only build and test that a release is
# guaranteed to have run.
#
# TWO WAYS IN:
#
#   workflow_dispatch  the normal path. Publishes if missing, then tags.
#   push: tags v*      the manual path, for a tag pushed by hand. Publishes
#                      only; the tag job does not run.
#
# DRY RUN. `dry_run: true` on a dispatch rehearses a release without making
# one: every guard and every test runs, the artifact is packed with
# `--dry-run`, nothing is published and nothing is tagged.
#
# IT DOES NOT TEST THE TRUSTED PUBLISHER, and must not be sold as if it did.
# `npm publish --dry-run` packs the tarball and stops; the OIDC exchange only
# happens inside a real publish. A rehearsal therefore proves the guards, the
# build, the tests and the tarball, and says nothing about whether the
# registration above took. Check that on the package's npm settings page.
#
# A REHEARSAL IS NOT A WEAKER CREDENTIAL, so it does not run off `main`
# either. `permissions` takes no expression, so this job holds
# `id-token: write` on every path through it, rehearsal included, and a
# dispatch runs the workflow and the project code AT THE REF IT IS GIVEN. An
# off-main rehearsal would run that branch's install, build and test scripts
# beside a credential that can mint an npm publishing token, and skipping the
# named publish step is not an authorization boundary. voxgig/struct exempts
# its rehearsal from the main check because minting and revoking a real
# crates.io token is the only way to test THAT registry's publisher; npm's
# dry run mints nothing, so the exemption would buy nothing here and is not
# carried over.
#
# For a boundary stronger than a step guard, put this job in a GitHub
# environment with a main-only deployment branch rule and register the npm
# publisher against that environment. The guard below lives in a file the
# dispatching ref controls; an environment rule does not.
#
# THE TAG HISTORY HAS A GAP, AND IT STAYS. Tagging stopped after v0.5.0
# while releases continued to npm, so 0.6.0 through 0.10.1 are published with
# no tag behind them. This file resumes tagging at the next release and does
# not backfill: a tag invented now would point at whatever main is on rather
# than the commit each version was built from, which is worse than an honest
# gap — and the gitHead guard below would refuse it anyway.
#
# VERSION BUMPS ARE NOT AUTOMATED, deliberately. Nothing here commits. It
# reads the version already on the branch and releases exactly that, so the
# bump stays a reviewable diff and the release stays a button.
#
#   package.json "version" -> tag v<version>
#
# Renaming this file breaks publishing until the npm-side trusted publisher
# is updated to match, so a rename and the `npm trust` re-run go together. Do
# NOT publish locally over a token: that bypasses OIDC and its provenance
# attestation entirely. The `repo-publish*` and `repo-stage-publish*` scripts
# in package.json are that older path; they remain for recovery, but a
# release cut through them lands unattested.

name: publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      expect_sha:
        description: 'Optional: refuse unless main is still at this commit'
        type: string
        default: ''
      dry_run:
        description: 'Rehearse only: run every guard and test, publish nothing, tag nothing'
        type: boolean
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish:
    name: npm publish
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Deliberately NOT contents: write — see the header. This job runs
    # dependency lifecycle scripts.
    permissions:
      id-token: write
      contents: read

    outputs:
      version: ${{ steps.versions.outputs.version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.x
          registry-url: 'https://registry.npmjs.org'

      - name: Resolve the version being released
        id: versions
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          test -n "$VERSION" || { echo "::error::could not read package.json version"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "$VERSION -> tag v$VERSION"

      # RELEASES COME FROM main, INCLUDING FROM THE BUTTON. `gh workflow run
      # --ref` accepts any branch or tag, so without this the Actions UI or a
      # stray API call could publish and tag a feature branch, irreversibly.
      #
      # A REHEARSAL IS NOT EXEMPT. This job holds `id-token: write` on every
      # path through it, so an off-main `dry_run` would run that branch's
      # install, build and test scripts beside a credential that can mint an
      # npm publishing token. Reaching no publish step does not take that
      # credential away. See the header.
      - name: Dispatches must come from main
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "::error::dispatch ref is $GITHUB_REF_NAME; releases must come from main"
            exit 1
          fi

      # `--ref main` names a MUTABLE branch, so between pushing the release
      # commit and this run resolving, another commit can land and be
      # published under the version just bumped. Pass the SHA you pushed; if
      # main has moved since, stop rather than release something nobody asked
      # for.
      - name: main must still be the commit we intended to release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.expect_sha != '' }}
        env:
          EXPECT_SHA: ${{ inputs.expect_sha }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_SHA" != "$EXPECT_SHA" ]; then
            echo "::error::main has moved: expected $EXPECT_SHA, got $GITHUB_SHA"
            exit 1
          fi

      # A tag pushed by hand must agree with the version it claims to
      # release. Without this, pushing v1.2.3 while package.json still says
      # 1.2.2 resolves 1.2.2, finds it already published, skips the publish,
      # and the run goes GREEN — leaving a tag with no release behind it.
      - name: The pushed tag must match the package version
        if: ${{ github.event_name == 'push' }}
        env:
          PKG_VERSION: ${{ steps.versions.outputs.version }}
        run: |
          set -euo pipefail
          WANT="v$PKG_VERSION"
          if [ "$GITHUB_REF_NAME" != "$WANT" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json ($WANT)"
            exit 1
          fi

      # AN EXISTING TAG IS ONLY A PROBLEM IF IT POINTS SOMEWHERE ELSE. A tag
      # already on this commit is the idempotent case — nothing to create,
      # not an error — which is what lets a partly-failed release be
      # re-dispatched.
      #
      # A REHEARSAL WARNS WHERE A RELEASE STOPS. This guard and the registry
      # one below ask "does the world already contain this version", and at
      # the moment you most want to rehearse — this file just changed, the
      # manifest still says the version last released — the honest answer is
      # yes. Failing there would mean no rehearsal without a bump first,
      # which is exactly the friction that stops people rehearsing at all.
      - name: Refuse a tag that points at a different commit
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          PKG_VERSION: ${{ steps.versions.outputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          TAG="v$PKG_VERSION"
          HEAD_SHA="$(git rev-parse HEAD)"
          AT="$(git rev-parse -q --verify "refs/tags/$TAG^{commit}" 2>/dev/null || true)"
          if [ -n "$AT" ] && [ "$AT" != "$HEAD_SHA" ]; then
            MSG="tag $TAG already exists on $AT, not this commit — bump package.json"
            if [ "${DRY_RUN:-false}" = "true" ]; then
              echo "::warning::$MSG (rehearsal: a real release stops here)"
            else
              echo "::error::$MSG"
              exit 1
            fi
          fi
          if [ -n "$AT" ]; then echo "$TAG already points here; nothing to create"; fi

      - name: Build and test
        run: |
          npm ci
          npm run build
          npm test

      # Trusted publishing requires npm >= 11.5.1.
      - name: Use a trusted-publishing capable npm
        run: npm install -g npm@latest

      # THE REGISTRY IS THE SOURCE OF TRUTH FOR "IS THIS RELEASED", not the
      # tag. A run can publish and then fail before tagging, leaving a
      # version on npm with nothing pointing at it. Without this check that
      # state is unrecoverable: the publish step dies on "cannot publish over
      # the previously published versions" before the tag job ever runs.
      #
      # In this repository that state is not hypothetical: six versions are
      # on npm with no tag behind them, for the reason the header gives.
      - name: Is this version already on npm?
        id: registry
        env:
          PKG_VERSION: ${{ steps.versions.outputs.version }}
        run: |
          set -euo pipefail
          V="$PKG_VERSION"
          if npm view "@voxgig/create-system@$V" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "$V is already on npm — skipping publish"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "$V is not on npm — will publish"
          fi

      # SKIPPING THE PUBLISH ASSUMES "SAME VERSION MEANS SAME CODE". That
      # holds only if main has not moved. Publish succeeds at commit A, the
      # tag job fails, main advances to B, someone re-dispatches: the version
      # is still on npm, so the publish is skipped and B gets tagged — while
      # the registry artifact was built from A. The tag would then point at
      # code the published package does not contain.
      #
      # npm records the source commit as `gitHead`, and a hand publish from a
      # git checkout records one too: @voxgig/create-system@0.10.1 carries
      # one. So a dispatch that forgets the version bump stops at the
      # mismatch below, which is the correct outcome.
      #
      # ABSENT gitHead IS NOT A WARNING. A version this workflow published
      # always records one, so absent means the artifact came from somewhere
      # else and nothing ties it to this commit; tagging it would be exactly
      # the false backfill the header refuses. Blocking cannot strand a
      # legitimate recovery, which is a re-dispatch after the tag job failed
      # on a version this workflow published, gitHead and all. The sibling
      # repositories warn here; this is a deliberate divergence.
      - name: A published version must come from this commit
        if: ${{ steps.registry.outputs.published == 'true' }}
        env:
          PKG_VERSION: ${{ steps.versions.outputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          V="$PKG_VERSION"
          GH="$(npm view "@voxgig/create-system@$V" gitHead 2>/dev/null || true)"
          if [ -z "$GH" ]; then
            MSG="npm records no gitHead for $V; nothing ties that published artifact to this commit, so it cannot be tagged — bump package.json"
            if [ "${DRY_RUN:-false}" = "true" ]; then
              echo "::warning::$MSG (rehearsal: a real release stops here)"
            else
              echo "::error::$MSG"
              exit 1
            fi
          elif [ "$GH" != "$GITHUB_SHA" ]; then
            MSG="npm has $V built from $GH, but this run is $GITHUB_SHA — tagging would point at code the registry does not contain"
            if [ "${DRY_RUN:-false}" = "true" ]; then
              echo "::warning::$MSG (rehearsal: a real release stops here)"
            else
              echo "::error::$MSG"
              exit 1
            fi
          else
            echo "$V on npm was built from this commit"
          fi

      # Publish BEFORE tagging (the tag job `needs` this one), so a tag only
      # ever exists for a release that reached the registry.
      - name: Publish to npm
        if: ${{ steps.registry.outputs.published == 'false' && !inputs.dry_run }}
        env:
          PKG_VERSION: ${{ steps.versions.outputs.version }}
        run: |
          set -euo pipefail
          V="$PKG_VERSION"
          # A PRERELEASE MUST NOT BECOME `latest`. `npm publish` defaults to
          # the latest dist-tag, so publishing 1.2.3-beta.1 that way hands it
          # to every unpinned install.
          case "$V" in
            *-*) DIST=next ;;
            *)   DIST=latest ;;
          esac
          echo "publishing $V under dist-tag $DIST"
          npm publish --access public --tag "$DIST"

      # A rehearsal packs the tarball and stops. It cannot prove npm's
      # trusted publisher works — that exchange happens inside a real
      # `npm publish` — so this checks the artifact, not the credential.
      - name: Rehearse the npm package
        if: ${{ inputs.dry_run }}
        run: npm publish --access public --dry-run

  # Runs git and nothing else. No npm install, no project code — so the
  # repository-write credential is never in scope while third-party code
  # runs.
  tag:
    name: tag
    needs: publish
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Tag the release
        env:
          PKG_VERSION: ${{ needs.publish.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v$PKG_VERSION"
          HEAD_SHA="$(git rev-parse HEAD)"

          # EXISTENCE IS NOT ENOUGH. `git rev-parse --verify` only asks
          # whether the name resolves; a tag created between the publish
          # job's guard and this checkout could point anywhere. Treating that
          # as the idempotent case would leave a green run with an npm
          # artifact from THIS commit and a release tag on a different one.
          # Dereference and compare.
          AT="$(git rev-parse -q --verify "refs/tags/$TAG^{commit}" 2>/dev/null || true)"
          if [ -n "$AT" ]; then
            if [ "$AT" != "$HEAD_SHA" ]; then
              echo "::error::$TAG exists on $AT, not this commit ($HEAD_SHA)"
              exit 1
            fi
            echo "$TAG already points here — nothing to do" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git tag "$TAG"
          git push origin "refs/tags/$TAG"
          echo "pushed $TAG" >> "$GITHUB_STEP_SUMMARY"
